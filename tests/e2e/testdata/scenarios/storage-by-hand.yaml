name: a storage written by hand beside the postgres is refused, on any target
values:
  openbao:
    storage:
      - type: raft
        config:
          path: /openbao/data
  postgres:
    database: openbao
env:
  keys:
    postgres:
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
expect:
  problems:
    - where: /openbao/storage
      kind: rule
      rule: storage-from-postgres
